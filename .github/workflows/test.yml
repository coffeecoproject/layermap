# Tests LayerMap on Linux, macOS and Windows: type check, lint, the test suite (which builds the
# Go, Java, Python and TypeScript analyzers first), and a smoke run of the CLI on this repository.
name: test
on:
  push:
    branches: [main, windows-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF line endings on Windows too (also set by .gitattributes).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      # pnpm runs a dependency's build script only when allowed; the repository keeps this file
      # untracked, so the job writes the same choice: esbuild's, and sqlite's prebuilt binaries.
      - name: Allow dependency build scripts
        shell: bash
        run: printf "allowBuilds:\n  '@photostructure/sqlite': false\n  esbuild: true\n" > pnpm-workspace.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          LAYERMAP_JAVA_HOME: ${{ env.JAVA_HOME }}
      - name: Smoke run of the CLI
        shell: bash
        env:
          LAYERMAP_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          node --import tsx src/cli.ts index
          node --import tsx src/cli.ts explore src --depth 1 | head -n 20
          node --import tsx src/cli.ts check | head -n 20
